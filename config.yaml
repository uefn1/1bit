# BitNet 3B 1bit LLM モデル設定

model:
  # 選定モデル
  name: "BitNet-3B-1bit"
  
  # HuggingFace HubのモデルID
  # BitNetはMicrosoft公式の1bit量子化モデル
  # 1bit量子化 (重みとアクティベーションの両方を1bitに量子化)
  huggingface_id: "microsoft/BitNet-3B-1bit"
  
  # 量子化設定
  # BitNetは1bit量子化を本格的にサポート
  quantization:
    bits: 1
    load_in_1bit: true
    load_in_4bit: false
    load_in_8bit: false
    
  # デバイス設定
  device: "auto"  # auto, cpu, cuda
  device_map: "auto"

# 推論設定
inference:
  max_new_tokens: 200
  temperature: 0.7
  top_k: 50
  top_p: 0.95
  do_sample: true
  repetition_penalty: 1.1

# コード生成設定
codegen:
  # コード生成時の最大トークン数
  max_code_tokens: 500
  
  # コード生成の温度（低いほど決定的）
  temperature: 0.5
  
  # 止めるトークン
  stop_tokens: ["\n\n\n", "<|im_end|>", "<|endoftext|>"]
  
  # コード生成用のシステムプロンプト
  system_prompt: |
    あなたはプロのソフトウェアエンジニアです。
    与えられた要件に基づいて、最適なコードを生成してください。
    コードは以下の要件を満たすようにしてください：
    - 正確でバグのないコード
    - 適切なコメント付き
    - 一般的なベストプラクティスに従う
    - Pythonの場合は型ヒント付き
    - 簡潔で読みやすい

    要求: {prompt}

    コード:

# GitHub Actions設定
github_actions:
  # 使用するランナー
  runner: "ubuntu-latest"
  
  # Pythonバージョン
  python_version: "3.10"
  
  # メモリ制限（GitHub Actionsの無料ランナーは7GB）
  memory_limit: "7GB"
  
  # タイムアウト
  timeout_minutes: 30

# フォールバックモデル (BitNetが見つからない場合)
fallback_models:
  - "microsoft/BitNet-3B-1bit"
  - "microsoft/BitNet-1.5B-1bit"
  - "TinyLlama/TinyLlama-1.1B"
  - "Qwen/Qwen2-0.5B-Instruct"
