# BitNet b1.58-2B-4T 設定 (bitnet.cppを使用)

model:
  # 選定モデル
  name: "BitNet-b1.58-2B-4T"
  
  # HuggingFace HubのモデルID
  # bitnet.cppではGGUFフォーマットのモデルを使用
  # GGUFモデルはHuggingFace Hubからダウンロード
  huggingface_id: "microsoft/bitnet-b1.58-2B-4T"
  
  # GGUFモデルのファイル名 (bitnet.cpp用)
  gguf_model: "bitnet-b1.58-2B-4T.gguf"
  
  # 量子化設定
  # bitnet.cppではGGUFファイルに量子化情報が含まれています
  quantization:
    bits: 1
    type: "i2_s"  # BitNetの量子化タイプ
    
  # 推論エンジン
  engine: "bitnet.cpp"  # bitnet.cpp or transformers
  
  # bitnet.cppの設定
  bitnet_cpp:
    use_gguf: true
    model_path: "models/bitnet-b1.58-2B-4T/ggml-model-i2_s.gguf"
    threads: 2
    ctx_size: 2048
    
  # デバイス設定
  device: "cpu"  # bitnet.cppはCPU専用
  device_map: "auto"

# 推論設定
inference:
  max_new_tokens: 128
  temperature: 0.7
  top_k: 50
  top_p: 0.95
  do_sample: true
  repetition_penalty: 1.1

# コード生成設定
codegen:
  # コード生成時の最大トークン数
  max_code_tokens: 500
  
  # コード生成の温度（低いほど決定的）
  temperature: 0.5
  
  # 止めるトークン
  stop_tokens: ["\n\n\n", "<|im_end|>", "<|endoftext|>"]
  
  # コード生成用のシステムプロンプト
  system_prompt: |
    あなたはプロのソフトウェアエンジニアです。
    与えられた要件に基づいて、最適なコードを生成してください。
    コードは以下の要件を満たすようにしてください：
    - 正確でバグのないコード
    - 適切なコメント付き
    - 一般的なベストプラクティスに従う
    - Pythonの場合は型ヒント付き
    - 簡潔で読みやすい

    要求: {prompt}

    コード:

# GitHub Actions設定
github_actions:
  # 使用するランナー
  runner: "ubuntu-latest"
  
  # Pythonバージョン
  python_version: "3.10"
  
  # メモリ制限（GitHub Actionsの無料ランナーは7GB）
  memory_limit: "7GB"
  
  # タイムアウト
  timeout_minutes: 60

# フォールバックモデル (BitNetが見つからない場合)
fallback_models:
  - "microsoft/bitnet-b1.58-2B-4T"
  - "microsoft/bitnet-b1.58-3B"
  - "microsoft/bitnet-b1.58-1.5B"
