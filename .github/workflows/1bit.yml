name: BitNet b1.58-2B-4T Inference & Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git wget \
            python3 python3-pip python3-venv \
            libcurl4-openssl-dev \
            clang-19 lld-19 ccache

      - name: Set compiler to clang-19
        run: |
          echo "CC=clang-19" >> $GITHUB_ENV
          echo "CXX=clang++-19" >> $GITHUB_ENV

      - name: Setup ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('BitNet/3rdparty/llama.cpp/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Enable ccache for CMake
        run: |
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clone BitNet repository
        run: |
          git clone --recursive https://github.com/microsoft/BitNet.git

      - name: Download BitNet b1.58-2B-4T GGUF model
        run: |
          mkdir -p models/BitNet-b1.58-2B-4T
          wget -O models/BitNet-b1.58-2B-4T/ggml-model-i2_s.gguf \
            https://github.com/uefn1/1bit/releases/download/bitnet-b1.58-2B-4T-gguf/ggml-model-i2_s.gguf
          wget -O models/BitNet-b1.58-2B-4T/data_summary_card.md \
            https://github.com/uefn1/1bit/releases/download/bitnet-b1.58-2B-4T-gguf/data_summary_card.md
          wget -O models/BitNet-b1.58-2B-4T/gitattributes.txt \
            https://github.com/uefn1/1bit/releases/download/bitnet-b1.58-2B-4T-gguf/gitattributes.txt
          wget -O models/BitNet-b1.58-2B-4T/README.md \
            https://github.com/uefn1/1bit/releases/download/bitnet-b1.58-2B-4T-gguf/README.md

      # source を使わず、venv 内のバイナリを直接呼び出す
      - name: Build bitnet.cpp
        working-directory: ./BitNet
        timeout-minutes: 120
        run: |
          # venv を作成（既に存在する場合はエラーを無視）
          python3 -m venv venv || true
          # pip を直接呼び出して依存関係をインストール
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt
          # setup_env.py を timeout でラップし、ハング時に強制終了させる
          timeout 6000 ./venv/bin/python setup_env.py -md ../models/BitNet-b1.58-2B-4T -q i2_s

      # 推論ステップでも source を使わず、venv/bin/python を直接呼び出す
      - name: Run inference and save log
        working-directory: ./BitNet
        timeout-minutes: 30
        run: |
          ./venv/bin/python run_inference.py \
            -m ../models/BitNet-b1.58-2B-4T/ggml-model-i2_s.gguf \
            -p "What is the capital of France?" \
            -n 256 \
            -t 4 \
            -temp 0.7 \
            -cnv > inference.log 2>&1
          cp inference.log ../inference.log

      - name: Upload inference result to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: inference-${{ github.run_id }}-${{ github.run_attempt }}
          name: "BitNet Inference Result (${{ github.run_id }}-${{ github.run_attempt }})"
          body: |
            BitNet b1.58-2B-4T inference output.
            - Run ID: ${{ github.run_id }}
            - Run Attempt: ${{ github.run_attempt }}
            - Commit: ${{ github.sha }}
          files: inference.log
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
