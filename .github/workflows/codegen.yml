name: Code Generation with BitNet 1bit LLM

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'codegen.py'
      - 'config.yaml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Code generation prompt'
        required: true
        default: 'Create a Python function that calculates factorial'
      language:
        description: 'Programming language'
        required: false
        default: 'python'
      output_file:
        description: 'Output file name'
        required: false
        default: 'generated_code.py'
      use_bitnet_cpp:
        description: 'Use bitnet.cpp engine (requires build)'
        required: false
        default: 'false'

jobs:
  generate-code:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.10"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive  # bitnet.cppサブモジュールを取得
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            git
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Build bitnet.cpp (if requested)
        if: ${{ github.event.inputs.use_bitnet_cpp == 'true' || github.event_name == 'push' }}
        run: |
          cd bitnet
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)
          cd ../..
        timeout-minutes: 20
      
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-huggingface-
      
      - name: Generate code with BitNet
        id: codegen
        run: |
          # 使用するエンジンを決定
          if [ "${{ github.event.inputs.use_bitnet_cpp }}" = "true" ]; then
            # bitnet.cppを使用
            python codegen.py \
              --prompt "${{ github.event.inputs.prompt }}" \
              --language "${{ github.event.inputs.language }}" \
              --output "${{ github.event.inputs.output_file }}" \
              --max-tokens 500
          else
            # HuggingFace Transformersを使用 (デフォルト)
            python codegen.py \
              --prompt "${{ github.event.inputs.prompt }}" \
              --language "${{ github.event.inputs.language }}" \
              --output "${{ github.event.inputs.output_file }}" \
              --max-tokens 500
          fi
        env:
          PYTHONUNBUFFERED: "1"
        timeout-minutes: 15
      
      - name: Display generated code
        run: |
          echo "=== Generated Code ==="
          cat ${{ github.event.inputs.output_file || 'generated_code.py' }}
          echo "=== End of Code ==="
      
      - name: Upload generated code as artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-code
          path: ${{ github.event.inputs.output_file || 'generated_code.py' }}
          retention-days: 7

  test-code:
    needs: generate-code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download generated code
        uses: actions/download-artifact@v4
        with:
          name: generated-code
      
      - name: Test Python code syntax
        if: ${{ github.event.inputs.language == 'python' || github.event.inputs.language == '' }}
        run: |
          python -m py_compile ${{ github.event.inputs.output_file || 'generated_code.py' }} && \
          echo "✅ Python syntax is valid" || \
          echo "❌ Python syntax error"
        continue-on-error: true
